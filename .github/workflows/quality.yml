name: quality

on:
  # A pull request runs the suite once. A push to a feature branch used to run it a
  # second time under the same commit, which doubled the matrix and asked for more
  # runners than the plan grants; the runners that did start were recycled mid-job
  # ("runner has received a shutdown signal"). Only the release branches run on push.
  push:
    branches: [dev, master]
  pull_request:

# A new commit supersedes the run it replaces. Without this, a push and the pull
# request it opens run the same suite twice and compete for the same runners.
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    name: go (vet, build, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # GitHub Actions sets CI=true, so integration tests must NOT skip here.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The version lives in backend/go.mod and nowhere else (issue #146).
          go-version-file: backend/go.mod
          # The module files live under backend/, so the default cache key (./go.sum) never
          # matched, the cache silently never restored, and every run re-downloaded the whole
          # module set from the proxy.
          cache-dependency-path: backend/go.sum
      - run: make backend-vet
      - run: make backend-build
      - run: make backend-test

  web:
    name: web (build, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-build
      # browsers come from karma.conf.js (headless, --no-sandbox)
      - run: make frontend-test

  contract:
    name: api contract (drift guard + generated client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the generator parses YAML (needs pyyaml)
        run: pip install pyyaml
      - name: drift guards + generator self-tests
        run: make contracts-check
      - name: generated client and spec are committed and current
        run: |
          make contracts-gen
          git diff --exit-code -- frontend/src/app/core/api/generated \
                                 contracts/openapi.yaml \
                                 backend/internal/httpapi/domaincodes.go
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate the OpenAPI document
        run: make contracts-validate

  # The target list comes from backend/mutation.json. A separate job publishes it so
  # mutation-go can fan out one job per package (a matrix cannot read a file).
  mutation-go-targets:
    name: mutation go targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: read backend/mutation.json (through the Makefile, which is what reads it)
        run: |
          targets=$(make -s mutation-targets)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  mutation-go:
    # One job per package. gremlins' full per-package sweep is minutes long, and a
    # single job running every target was terminated by the runner before it could
    # report a score (issue #28). Sharding keeps each job well inside a bounded
    # timeout and lets its output stream. The bound is headroom, not a target: the
    # largest package (kasse) has taken up to ~30 minutes on a 2-core runner (#47).
    name: mutation go ${{ matrix.target }} (floor 85)
    needs: mutation-go-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Every package starts as its own job. Starting all ~25 at once asks for more
      # concurrent runners than the plan grants, so the excess queues and the runners
      # that do start are recycled mid-job — the "runner has received a shutdown
      # signal" shard in #186. Throttling the matrix keeps each shard on a runner that
      # survives to report a score.
      max-parallel: 8
      matrix:
        target: ${{ fromJSON(needs.mutation-go-targets.outputs.targets) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # gremlins runs each package's tests, integration tests included.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      # One shard per package means the module set is fetched ~25 times per run, and a
      # transient proxy blip used to fail a shard whose package is nowhere near the change
      # ("stream error: INTERNAL_ERROR; received from peer"). Both network calls retry, and
      # both are targets, so what CI proves is what `make` does.
      - name: warm the module cache
        run: make go-deps-retry
      - name: install gremlins
        run: make gremlins-install
      - name: gremlins ${{ matrix.target }}
        # One package per shard; the target gives every package its own cache dir and
        # fails a run that produced no mutants (a vacuous pass).
        #
        # The shard's own wall-clock bound, inside the job's 45 minutes: a wedged mutant
        # should fail in 40 and be rerun, not sit until the job timeout and be reported
        # as a shutdown of the pull request (#186). The largest package has taken ~30
        # minutes, so the bound is headroom above a healthy run, not a cap on it. The
        # bound lives in the target, so a local run stays unbounded.
        run: make backend-mutation PKG="${{ matrix.target }}" MUTATION_SHARD_TIMEOUT=40m

  mutation-web:
    name: mutation web (floor 85)
    runs-on: ubuntu-latest
    # A bound, not a cap: the suite takes ~2 hours on a 2-core runner, so the bound is
    # set above that and its job timeout above the bound. It still replaces the default
    # 360-minute job timeout, which is how a wedged run sat all afternoon (#186).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-mutation MUTATION_SHARD_TIMEOUT=120m

  # The release workflow publishes these images, so the thing they are published
  # from has to build - and the stack the README tells you to run has to come up:
  # a Dockerfile whose toolchain pin drifts from go.mod fails at the first release
  # otherwise (#146), and an image whose entrypoint swallows the role command looks
  # healthy while every "role" is the api (it was: ENTRYPOINT + compose `command:`).
  # Build only - pushing belongs to release.yml.
  images:
    name: images (docker build + the stack boots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build both images
        run: make docker-images TAG=ci
      - name: the stack starts, serves and runs the role it was asked for
        env:
          IMAGE_BACKEND: campus-erp-backend:ci
          IMAGE_FRONTEND: campus-erp-frontend:ci
        # The whole procedure is one target: the volume prep, `make run` and its readiness
        # wait, and the PID 1 assertion. CI proves the target, not a copy of it.
        run: make stack-smoke TAG=ci
      - name: tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: e2e (playwright + a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-e2e-install
      - run: make frontend-e2e
