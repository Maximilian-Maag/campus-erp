name: quality

on:
  push:
  pull_request:

jobs:
  go:
    name: go (vet, build, unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # GitHub Actions sets CI=true, so integration tests must NOT skip here.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    name: web (build, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration development
      # browsers come from karma.conf.js (headless, --no-sandbox)
      - run: npx ng test --watch=false

  contract:
    name: api contract (drift guard + generated client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: drift guard + tool self-test (stdlib only)
        run: |
          python3 tools/api_contract.py selftest
          python3 tools/api_contract.py check
      - name: generated client is committed and current
        run: |
          python3 tools/api_contract.py gen
          git diff --exit-code -- frontend/src/app/core/api/generated
      - name: spec is in sync with the Go structs
        run: |
          pip install pyyaml
          python3 tools/gen_openapi.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate the OpenAPI document
        run: npx --yes @redocly/cli lint --config .redocly.yaml contracts/openapi.yaml

  # The target list comes from backend/mutation.json. A separate job publishes it so
  # mutation-go can fan out one job per package (a matrix cannot read a file).
  mutation-go-targets:
    name: mutation go targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: read backend/mutation.json
        run: |
          targets=$(python3 -c "import json;print(json.dumps([t['path'] for t in json.load(open('backend/mutation.json'))['targets']]))")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  mutation-go:
    # One job per package. gremlins' full per-package sweep is minutes long, and a
    # single job running every target was terminated by the runner before it could
    # report a score (issue #28). Sharding keeps each job well inside a bounded
    # timeout and lets its output stream.
    name: mutation go ${{ matrix.target }} (floor 85)
    needs: mutation-go-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.mutation-go-targets.outputs.targets) }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # gremlins runs each package's tests, integration tests included.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: gremlins ${{ matrix.target }}
        run: |
          set -euo pipefail
          pkg="${{ matrix.target }}"
          # Isolate gremlins' coverage cache per package: a shared cache yields
          # wrong, non-reproducible scores.
          cache_root=$(mktemp -d)
          df -h /
          free -m
          out=$(XDG_CACHE_HOME="$cache_root/${pkg//\//_}" stdbuf -oL -eL gremlins unleash --threshold-efficacy 85 "./$pkg" 2>&1) || { echo "$out"; df -h /; exit 1; }
          echo "$out"
          if echo "$out" | grep -q "No results to report"; then
            echo "no mutants produced for $pkg (vacuous run)"; exit 1
          fi

  mutation-web:
    name: mutation web (floor 85)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx stryker run

  e2e:
    name: e2e (playwright + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
