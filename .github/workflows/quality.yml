name: quality

on:
  push:
  pull_request:

jobs:
  go:
    name: go (vet, build, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # GitHub Actions sets CI=true, so integration tests must NOT skip here.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The version lives in backend/go.mod and nowhere else (issue #146).
          go-version-file: backend/go.mod
          # The module files live under backend/, so the default cache key (./go.sum) never
          # matched, the cache silently never restored, and every run re-downloaded the whole
          # module set from the proxy.
          cache-dependency-path: backend/go.sum
      - run: make backend-vet
      - run: make backend-build
      - run: make backend-test

  web:
    name: web (build, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-build
      # browsers come from karma.conf.js (headless, --no-sandbox)
      - run: make frontend-test

  contract:
    name: api contract (drift guard + generated client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the generator parses YAML (needs pyyaml)
        run: pip install pyyaml
      - name: drift guards + generator self-tests
        run: make contracts-check
      - name: generated client and spec are committed and current
        run: |
          make contracts-gen
          git diff --exit-code -- frontend/src/app/core/api/generated \
                                 contracts/openapi.yaml \
                                 backend/internal/httpapi/domaincodes.go
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate the OpenAPI document
        run: make contracts-validate

  # The target list comes from backend/mutation.json. A separate job publishes it so
  # mutation-go can fan out one job per package (a matrix cannot read a file).
  mutation-go-targets:
    name: mutation go targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: read backend/mutation.json
        run: |
          targets=$(python3 -c "import json;print(json.dumps([t['path'] for t in json.load(open('backend/mutation.json'))['targets']]))")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  mutation-go:
    # One job per package. gremlins' full per-package sweep is minutes long, and a
    # single job running every target was terminated by the runner before it could
    # report a score (issue #28). Sharding keeps each job well inside a bounded
    # timeout and lets its output stream. The bound is headroom, not a target: the
    # largest package (kasse) has taken up to ~30 minutes on a 2-core runner (#47).
    name: mutation go ${{ matrix.target }} (floor 85)
    needs: mutation-go-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.mutation-go-targets.outputs.targets) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: campus_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # gremlins runs each package's tests, integration tests included.
      DATABASE_URL: postgres://postgres:erp@localhost:5432/campus_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      # One shard per package means the module set is fetched ~25 times per run, and a
      # transient proxy blip used to fail a shard whose package is nowhere near the change
      # ("stream error: INTERNAL_ERROR; received from peer"). Warm the cache with retries so
      # a hiccup is not a red build.
      - name: warm the module cache
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make go-deps; then echo "modules downloaded (attempt $attempt)"; exit 0; fi
            echo "go mod download failed (attempt $attempt) - retrying"
            sleep 10
          done
          echo "module download still failing after 3 attempts"; exit 1
      - name: install gremlins
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go install github.com/go-gremlins/gremlins/cmd/gremlins@latest; then exit 0; fi
            echo "go install failed (attempt $attempt) - retrying"
            sleep 10
          done
          echo "go install still failing after 3 attempts"; exit 1
      - name: gremlins ${{ matrix.target }}
        # One package per shard; the target gives every package its own cache dir and
        # fails a run that produced no mutants (a vacuous pass).
        run: make backend-mutation PKG="${{ matrix.target }}"

  mutation-web:
    name: mutation web (floor 85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-mutation

  # The release workflow publishes these images, so the thing they are published
  # from has to build - and the stack the README tells you to run has to come up:
  # a Dockerfile whose toolchain pin drifts from go.mod fails at the first release
  # otherwise (#146), and an image whose entrypoint swallows the role command looks
  # healthy while every "role" is the api (it was: ENTRYPOINT + compose `command:`).
  # Build only - pushing belongs to release.yml.
  images:
    name: images (docker build + the stack boots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build both images
        run: make docker-images TAG=ci
      - name: the stack starts, serves and runs the role it was asked for
        env:
          IMAGE_BACKEND: campus-erp-backend:ci
          IMAGE_FRONTEND: campus-erp-frontend:ci
        run: |
          set -euo pipefail
          # Populate the volume from the image ONCE, alone, before three services mount it at the
          # same time. Docker copies the image's /data (documents, outbox) into a fresh named
          # volume on first use; when api, worker and connectors each trigger that copy-up
          # concurrently, the result can be a corrupt entry and the start fails with
          # "failed to mkdir .../documents: file exists".
          docker volume create campus-erp_erpdata >/dev/null
          docker run --rm -v campus-erp_erpdata:/data --entrypoint /bin/true "$IMAGE_BACKEND"
          # Through the Makefile, so the target (and its readiness wait) is what CI
          # proves - not a hand-written copy of it.
          make run TAG=ci
          curl -fsS http://localhost:8080/readyz
          curl -fsS -o /dev/null http://localhost:8081/
          # PID 1 must be the role binary: compose `command:` replaces the image's
          # CMD, and an ENTRYPOINT would silently append to it instead.
          for role in api worker connectors; do
            cmd=$(docker compose exec -T "$role" cat /proc/1/cmdline | tr -d '\0')
            echo "$role -> $cmd"
            if [[ $cmd != "/app/$role" ]]; then
              echo "error: the $role service is running $cmd"
              docker compose logs --tail=40 "$role"
              exit 1
            fi
          done
          docker compose ps
      - name: tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: e2e (playwright + a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-e2e-install
      - run: make frontend-e2e
