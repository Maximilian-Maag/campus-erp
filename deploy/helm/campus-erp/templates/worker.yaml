apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campus-erp.fullname" . }}-worker
  labels:
    {{- include "campus-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "campus-erp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "campus-erp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ include "campus-erp.backendImage" . }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["/app/worker"]
          env:
            - name: ERP_ROLE
              value: worker
            - name: ERP_TENANT
              value: {{ .Values.config.tenant | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "campus-erp.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
