{{- if .Values.pdf.enabled }}
# Document service: renders HTML to PDF (ADR-0009). Stateless; the application posts
# the HTML it rendered and stores the returned PDF in the object store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pdf
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-pdf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.pdf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-pdf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-pdf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: pdf
          image: "{{ .Values.pdf.image.repository }}:{{ .Values.pdf.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.pdf.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
{{ toYaml .Values.pdf.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pdf
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-pdf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-pdf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.pdf.port }}
      targetPort: http
{{- end }}
