{{- if .Values.redis.enabled }}
{{- /* Sessions / rate-limiting / cache (ADR-0007). Off by default: point the
       roles at an external Redis, or enable this for a self-contained install. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campus-erp.fullname" . }}-redis
  labels:
    {{- include "campus-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "campus-erp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "campus-erp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campus-erp.fullname" . }}-redis
  labels:
    {{- include "campus-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "campus-erp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
