{{- /* Only created when the chart is asked to own the DSN. Prefer an existing
Secret in production (database.existingSecret). */ -}}
{{- if and (not .Values.database.existingSecret) .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campus-erp.dbSecretName" . }}
  labels:
    {{- include "campus-erp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end }}
