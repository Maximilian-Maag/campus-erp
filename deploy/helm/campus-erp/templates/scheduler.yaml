{{- if .Values.scheduler.enabled }}
{{- /* Nightly batch (ETL, dunning, statement fetch) as a CronJob (ADR-0007). */ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "campus-erp.fullname" . }}-scheduler
  labels:
    {{- include "campus-erp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "campus-erp.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduler
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scheduler
              image: "{{ include "campus-erp.backendImage" . }}"
              imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
              command: ["/app/worker"]
              env:
                - name: ERP_ROLE
                  value: worker
                - name: ERP_TENANT
                  value: {{ .Values.config.tenant | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "campus-erp.dbSecretName" . }}
                      key: {{ .Values.database.secretKey }}
{{- end }}
