# Default values for the campus-erp chart.
# Override with: helm upgrade --install campus-erp deploy/helm/campus-erp -f my-values.yaml

nameOverride: ""
fullnameOverride: ""

images:
  backend:
    repository: campus-erp-backend
    tag: dev
    pullPolicy: IfNotPresent
  frontend:
    repository: campus-erp-frontend
    tag: dev
    pullPolicy: IfNotPresent
imagePullSecrets: []

# Runtime configuration shared by every backend role.
config:
  tenant: demo
  httpAddr: ":8080"
  # Key in the database Secret holding the per-tenant DSN template (with
  # "{tenant}"). When present the API serves tenants multi-tenant (ADR-0002);
  # absent, it runs single-tenant against DATABASE_URL.
  tenantDsnKey: TENANT_DSN
  # OIDC (ADR-0003). With jwksUrl set the API requires bearer tokens on /api/*;
  # empty disables auth (local development only).
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""

# Per-tenant DSN. Either point at an existing Secret (recommended for prod) or let
# the chart create one from `url` (handy for a first install / demos).
database:
  existingSecret: ""        # Secret name; must contain the key below
  secretKey: DATABASE_URL
  url: ""                   # used only when existingSecret is empty

api:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }

worker:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }

connectors:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

web:
  replicaCount: 2
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    port: 80

service:
  type: ClusterIP
  port: 8080

autoscaling:
  api:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  web:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # Per-tenant hostnames (ADR-0002 / ADR-0007): the first label is the tenant.
  hosts:
    - host: demo.erp.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# ── ADR-0007 infrastructure ──────────────────────────────────────────────────
# All off by default; each can instead point at a managed/on-prem equivalent. The
# chart provisions them only when enabled, so a first install stays lean.

postgres:
  # CloudNativePG cluster (one cluster, one database per tenant — ADR-0002).
  enabled: false
  instances: 3            # 1 primary + 2 read replicas
  storage: 50Gi
  storageClass: ""        # cluster default when empty
  owner: erp
  pooler:
    # PgBouncer, transaction pooling, one pool per cluster.
    enabled: false
    instances: 2

scheduler:
  # Nightly batch (ETL, dunning, statement fetch) as a CronJob.
  enabled: false
  schedule: "0 2 * * *"

redis:
  # Sessions / rate-limiting / cache.
  enabled: false
  image: redis:7-alpine

objectStorage:
  # S3-compatible (MinIO on-prem or university S3). Consumed by the roles as the
  # object-storage features land; the chart only carries the endpoint config.
  endpoint: ""
  bucket: ""
