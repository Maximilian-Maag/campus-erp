# nginx config for the Angular SPA (templated: ${API_UPSTREAM} is substituted at
# container start-up by the official nginx entrypoint).
#
# Only variables that exist in the environment are substituted, so nginx's own
# $uri / $host are left untouched.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container / load-balancer liveness — does not touch the backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API on the same origin (no CORS for the SPA). Trailing slash on proxy_pass
    # is intentionally omitted so the /api prefix is preserved for the backend.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant          $tenant;
        proxy_read_timeout 60s;
    }

    # Hashed build artefacts are immutable.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The tenant is the first hostname label; expose it to the API proxy.
    set $tenant "";
    if ($host ~* "^([a-z0-9][a-z0-9-]*)\.") {
        set $tenant $1;
    }
}
